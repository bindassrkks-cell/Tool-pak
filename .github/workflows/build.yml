                      Spacer(modifier = Modifier.width(6.dp))
                      Text("Back", color = AccentTeal, fontSize = 14.sp)
                  }
                  Text("RJTOOL v1.0.59", color = Color.White, fontWeight = FontWeight.Bold)
              }
              Text(title, color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
              Text(subtitle, color = TextGray, fontSize = 12.sp)
          }

          @Composable
          fun TerminalBox(text: String) {
              Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = CardSurface), border = BorderStroke(1.dp, CardStroke)) {
                  Text(text, color = AccentTeal, modifier = Modifier.padding(12.dp), fontSize = 11.sp, fontFamily = FontFamily.Monospace)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">RJTOOL</string>
          </resources>
          EOF

          touch app/proguard-rules.pro

      - name: Commit and Push Files to Repository
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/ assets/ python_source/ gradle.properties settings.gradle build.gradle || true
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Fix file detection, add native storage scanner & real engine modules [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully pushed all files to the repository branch."
          fi

      - name: Setup Gradle 8.4 Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle-8.4-bin.zip
          unzip -q -o /tmp/gradle-8.4-bin.zip -d /tmp/
          /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          rm -rf /tmp/gradle-8.4 /tmp/gradle-8.4-bin.zip

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/RJTOOL-v1.0.59-debug.apk
          cp -r python_source release/python_engine_source
          cp assets/index.csv release/index.csv
          sha256sum release/RJTOOL-v1.0.59-debug.apk release/index.csv > release/SHA256SUMS.txt

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RJTOOL-v1.0.59-${{ github.run_number }}
          if-no-files-found: error
          path: release/
